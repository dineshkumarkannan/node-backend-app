version: '1.0'
services:
  app:
    build: .
    container_name: todo-app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/nodetodoapp
      - JWT_SECRET=your_jwt_secret
      - NODE_ENV=development
      - PORT=8383
    ports:
      - "8383:8383"
    depends_on:
      - db
    volumes:
      - .:/app
    
  db:
    image: postgres:13-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodetodoapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    
volumes:
  postgres-data: